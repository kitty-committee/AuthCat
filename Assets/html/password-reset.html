<!doctype html>
<html>
  <head>
    <title>AuthCat Login</title>
    <link
      rel="stylesheet"
      href="https://nathcat.net/static/css/new-common.css"
    />

    <meta charset="utf-8" />

    <style>
      .main {
        padding: 20px;
        box-sizing: border-box;
      }

      .header {
        padding: 20px;
        border-bottom: 1px solid var(--quad-color);
      }
    </style>
  </head>

  <body>
    <div class="content">
      <header template></header>
      <div class="main">
        <h2>Reset password for $$username$$</h2>

        <form
          id="form"
          method="POST"
          action="/reset-password/reset?t=$$token$$"
          class="column align-center"
        >
          <input type="password" name="password" placeholder="New password" />
          <input type="submit" value="Reset password" />
        </form>
      </div>
      <footer template></footer>
    </div>
  </body>
</html>
